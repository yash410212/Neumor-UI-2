name: Build APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract uploaded project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf project
          mkdir -p project
          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d project
          ROOT="project"
          if [ ! -f "$ROOT/settings.gradle" ] && [ ! -f "$ROOT/settings.gradle.kts" ]; then
            SETTINGS="$(find "$ROOT" -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            test -n "$SETTINGS"
            ROOT="$(dirname "$SETTINGS")"
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
          find "$ROOT" -type f -name "build.gradle.kts" -exec sed -i "s/compileSdk = 35/compileSdk = 36/g" {} +
          find "$ROOT" -type f -name "build.gradle" -exec sed -i "s/compileSdk 35/compileSdk 36/g" {} +
          grep -R "compileSdk" "$ROOT" --include="build.gradle*" || true
          MAIN="$(find "$ROOT" -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN"
          # Kotlin/Compose compatibility fixes for the uploaded source.
          # Print numbered source around every compiler-reported area before patching.
          echo "=== SOURCE ERROR AREAS ==="
          nl -ba "$MAIN" | sed -n '205,220p;705,730p;755,780p;920,935p;1095,1105p;1195,1225p;1318,1327p'
          sed -i 's/import androidx.compose.runtime.composed/import androidx.compose.ui.composed/' "$MAIN"
          grep -q 'import androidx.compose.foundation.horizontalScroll' "$MAIN" || sed -i '/import androidx.compose.foundation.verticalScroll/a import androidx.compose.foundation.horizontalScroll' "$MAIN"
          sed -i 's/override fun onNewIntent(intent:Intent?)/override fun onNewIntent(intent:Intent)/' "$MAIN"
          sed -i 's/setIntent(intent)/setIntent(intent)/' "$MAIN"
          sed -i 's/ComponentName(pkg,activity)/ComponentName(pkg ?: return,activity)/' "$MAIN"
          # Targeted Kotlin/Compose fixes for the uploaded launcher source.
          sed -i 's/private fun NeumorphicCard(/@Composable private fun NeumorphicCard(/' "$MAIN"
          sed -i 's/Surface(onClick=vm::resetDefaults/Surface(onClick={vm.resetDefaults(context)}/' "$MAIN"
          sed -i 's/vm::resetDefaults/{vm.resetDefaults(context)}/g' "$MAIN"
          sed -i 's/page,index/pageIndex,index/g' "$MAIN"
          sed -i 's/val cell=((maxWidth.toPx()-gap\*(cols-1))/val cell=((with(density){maxWidth.toPx()}-gap*(cols-1))/' "$MAIN"
          sed -i 's/@Composable private fun composedClickable/@Composable private fun composedClickable/' "$MAIN"
          # Fix local modifier helper calling composables by making the helper composable.
          sed -i 's/private fun Modifier.clickableWithoutRipple/@Composable private fun Modifier.clickableWithoutRipple/' "$MAIN"
          # Additional source-level compatibility fixes from Run #13 compiler output.
          # removedHomeIds is a persisted String in the uploaded source.
          sed -i 's/removedHomeIds = p.getString("removed_home_ids", "").orEmpty().split("|").filter { it.isNotBlank() }.toSet()/removedHomeIds = p.getString("removed_home_ids", "") ?: ""/' "$MAIN"
          # ThemeChoice is called from RowScope, so make the function a RowScope extension.
          sed -i 's/@Composable private fun ThemeChoice(/@Composable private fun RowScope.ThemeChoice(/' "$MAIN"
          # Older Compose animation API does not accept the label argument.
          sed -i 's/,label="folderX"//g; s/,label="folderY"//g' "$MAIN"
          # Avoid an unresolved outer muted reference in the home long-press menu.
          sed -i 's/Text("Remove",color=accent/Text("Remove",color=accent/' "$MAIN"
          sed -i 's/Text("Remove",color=accent,fontSize=10.sp/Text("Remove",color=MaterialTheme.colorScheme.primary,fontSize=10.sp/' "$MAIN"
          # Use a stable Compose density conversion for BoxWithConstraints width.
          sed -i 's/with(density){maxWidth.toPx()}/with(density){maxWidth.toPx()}/' "$MAIN"
          echo "=== EXTRA PATCHES APPLIED ==="
          # Run 14: fix persisted IDs and remaining Compose API/type errors.
          sed -i 's/productiveMode=p.getString("productiveMode","false") ?: "false"/productiveMode=p.getBoolean("productiveMode",false)/' "$MAIN"
          sed -i 's/studyMode=p.getString("studyMode","false") ?: "false"/studyMode=p.getBoolean("studyMode",false)/' "$MAIN"
          sed -i 's/removedHomeIds = p.getString("removed_home_ids", "") ?: ""/removedHomeIds = (p.getString("removed_home_ids", "") ?: "").split("|").filter { it.isNotBlank() }.toSet()/' "$MAIN"
          # Replace undeclared muted with the existing mutedColor/theme color expression.
          sed -i 's/color=muted/color=MaterialTheme.colorScheme.onSurfaceVariant/g' "$MAIN"
          # Compose Dp-to-px conversion: use LocalDensity explicitly where needed.
          grep -q 'import androidx.compose.ui.platform.LocalDensity' "$MAIN" || sed -i '/import androidx.compose.ui.platform./a import androidx.compose.ui.platform.LocalDensity' "$MAIN"
          sed -i 's/maxWidth.toPx()/with(LocalDensity.current) { maxWidth.toPx() }/g' "$MAIN"
          sed -i 's/decodeWidgets(p.getString("widgets_home", ""))/decodeWidgets(p.getString("widgets_home", "") ?: "")/g' "$MAIN"
          sed -i 's/,label="folderX"//g; s/,label="folderY"//g; s/,label="folderX"//g; s/,label="folderY"//g' "$MAIN"
          # Remove accidental nested density wrapper from previous patch if produced.
          sed -i 's/with(density){with(LocalDensity.current) { maxWidth.toPx() }}/with(LocalDensity.current) { maxWidth.toPx() }/g' "$MAIN"
          # Fix Run 17 folder drag arithmetic/animation overloads.
          sed -i 's/val ax by androidx.compose.animation.core.animateFloatAsState(dx,androidx.compose.animation.core.spring(dampingRatio=.82f,stiffness=300f),label="folderX")/val ax=dx/' "$MAIN"
          sed -i 's/val ay by androidx.compose.animation.core.animateFloatAsState(dy,androidx.compose.animation.core.spring(dampingRatio=.82f,stiffness=300f),label="folderY")/val ay=dy/' "$MAIN"
          sed -i 's/(86.dp.value\*density+gap)/(86f*density+gap)/g' "$MAIN"
          # Run 18: replace fragile folder animation/drag lambdas with compiler-safe expressions.
          sed -i 's/^[[:space:]]*val ax by androidx\.compose\.animation\.core\.animateFloatAsState.*/                            val ax=dx/' "$MAIN"
          sed -i 's/^[[:space:]]*val ay by androidx\.compose\.animation\.core\.animateFloatAsState.*/                            val ay=dy/' "$MAIN"
          sed -i 's/^[[:space:]]*onDragEnd={val from=folderDragging.*/                                    onDragEnd={ val from:Int=folderDragging; val to:Int=folderTarget; if(from>=0 \&\& to>=0 \&\& from!=to){ vm.moveInsideFolder(folder.id,from,to) }; folderDragging=-1; folderTarget=-1; folderOffset=androidx.compose.ui.geometry.Offset.Zero }/' "$MAIN"
          # Run 19: harden folder grid numeric types and remove problematic drag animation math.
          sed -i 's/val cell=((with(density){maxWidth.toPx()}-gap\*(cols-1))\/cols).coerceAtLeast(1f)/val cell:Float=((with(density){maxWidth.toPx()}-gap*(cols-1))\/cols).coerceAtLeast(1f)/' "$MAIN"
          sed -i 's/val dx=(displayIndex%cols-index%cols)\*cell + if(isDragging) folderOffset.x else 0f/val dx:Float=(displayIndex%cols-index%cols).toFloat()*cell + if(isDragging) folderOffset.x else 0f/' "$MAIN"
          sed -i 's/val dy=(displayIndex\/cols-index\/cols)\*(86f\*density+gap) + if(isDragging) folderOffset.y else 0f/val dy:Float=(displayIndex\/cols-index\/cols).toFloat()*(86f*density+gap) + if(isDragging) folderOffset.y else 0f/' "$MAIN"
          sed -i 's/val ax=dx/val ax:Float=dx/' "$MAIN"
          sed -i 's/val ay=dy/val ay:Float=dy/' "$MAIN"
          sed -i 's/val cs=(folderOffset.x\/cell)\.roundToInt()/val cs=(folderOffset.x\/cell).roundToInt()/' "$MAIN"
          # Run 20: LocalDensity is a Density object; convert dp to px explicitly.
          sed -i 's/86f\*density+gap/with(density){86.dp.toPx()}+gap/g' "$MAIN"
          # Run 21: Kotlin property setters clash with explicitly named setter methods.
          sed -i 's/var iconSize=IconSize.MEDIUM/var iconSize=IconSize.MEDIUM private set/' "$MAIN"
          sed -i 's/var iconShape=IconShape.ROUNDED/var iconShape=IconShape.ROUNDED private set/' "$MAIN"
          sed -i 's/var animationValue=0.8f/var animationValue=0.8f private set/' "$MAIN"
          sed -i 's/var animationDuration=0.28f/var animationDuration=0.28f private set/' "$MAIN"
          sed -i 's/var animationType=AnimationType.SPRING/var animationType=AnimationType.SPRING private set/' "$MAIN"
          sed -i 's/var edgeGesture=EdgeGesture.LEFT/var edgeGesture=EdgeGesture.LEFT private set/' "$MAIN"
          sed -i 's/var settingsPage="main"/var settingsPage="main" private set/' "$MAIN"
          sed -i 's/var drawerListMode=true/var drawerListMode=true private set/' "$MAIN"
          sed -i 's/var drawerCategory="All"/var drawerCategory="All" private set/' "$MAIN"
          sed -i 's/var currentHomePage=0/var currentHomePage=0 private set/' "$MAIN"
          sed -i 's/var performanceMode=PerformanceMode.BALANCED/var performanceMode=PerformanceMode.BALANCED private set/' "$MAIN"
          sed -i 's/var productiveMode=false/var productiveMode=false private set/' "$MAIN"
          sed -i 's/var studyMode=false/var studyMode=false private set/' "$MAIN"
          sed -i 's/var chargingNotchEnabled=true/var chargingNotchEnabled=true private set/' "$MAIN"
          sed -i 's/var chargingNotchStyle="Glow"/var chargingNotchStyle="Glow" private set/' "$MAIN"
          sed -i 's/var chargingNotchSpeed=70f/var chargingNotchSpeed=70f private set/' "$MAIN"
          # Run 23: rename JVM signatures of explicit setter methods so Kotlin properties can keep their source names.
          # This preserves all UI behavior and only resolves JVM accessor collisions.
          for spec in \
            'setIconSize|setIconSizeExplicit' \
            'setIconShape|setIconShapeExplicit' \
            'setAnimationValue|setAnimationValueExplicit' \
            'setAnimationDuration|setAnimationDurationExplicit' \
            'setAnimationType|setAnimationTypeExplicit' \
            'setEdgeGesture|setEdgeGestureExplicit' \
            'setSettingsPage|setSettingsPageExplicit' \
            'setDrawerListMode|setDrawerListModeExplicit' \
            'setDrawerCategory|setDrawerCategoryExplicit' \
            'setCurrentHomePage|setCurrentHomePageExplicit' \
            'setPerformanceMode|setPerformanceModeExplicit' \
            'setProductiveMode|setProductiveModeExplicit' \
            'setStudyMode|setStudyModeExplicit' \
            'setChargingNotchEnabled|setChargingNotchEnabledExplicit' \
            'setChargingNotchStyle|setChargingNotchStyleExplicit' \
            'setChargingNotchSpeed|setChargingNotchSpeedExplicit'; do
            OLD="${spec%%|*}"; NEW="${spec##*|}"
            sed -i "s/^[[:space:]]*fun ${OLD}(/    @kotlin.jvm.JvmName(\"${NEW}\")\\
    fun ${OLD}(/" "$MAIN"
          done
          # The source may use compact one-line declarations; handle those too.
          sed -i 's/fun setIconSize(/@kotlin.jvm.JvmName("setIconSizeExplicit") fun setIconSize(/g' "$MAIN"
          sed -i 's/fun setIconShape(/@kotlin.jvm.JvmName("setIconShapeExplicit") fun setIconShape(/g' "$MAIN"
          sed -i 's/fun setAnimationValue(/@kotlin.jvm.JvmName("setAnimationValueExplicit") fun setAnimationValue(/g' "$MAIN"
          sed -i 's/fun setAnimationDuration(/@kotlin.jvm.JvmName("setAnimationDurationExplicit") fun setAnimationDuration(/g' "$MAIN"
          sed -i 's/fun setAnimationType(/@kotlin.jvm.JvmName("setAnimationTypeExplicit") fun setAnimationType(/g' "$MAIN"
          sed -i 's/fun setEdgeGesture(/@kotlin.jvm.JvmName("setEdgeGestureExplicit") fun setEdgeGesture(/g' "$MAIN"
          sed -i 's/fun setSettingsPage(/@kotlin.jvm.JvmName("setSettingsPageExplicit") fun setSettingsPage(/g' "$MAIN"
          sed -i 's/fun setDrawerListMode(/@kotlin.jvm.JvmName("setDrawerListModeExplicit") fun setDrawerListMode(/g' "$MAIN"
          sed -i 's/fun setDrawerCategory(/@kotlin.jvm.JvmName("setDrawerCategoryExplicit") fun setDrawerCategory(/g' "$MAIN"
          sed -i 's/fun setCurrentHomePage(/@kotlin.jvm.JvmName("setCurrentHomePageExplicit") fun setCurrentHomePage(/g' "$MAIN"
          sed -i 's/fun setPerformanceMode(/@kotlin.jvm.JvmName("setPerformanceModeExplicit") fun setPerformanceMode(/g' "$MAIN"
          sed -i 's/fun setProductiveMode(/@kotlin.jvm.JvmName("setProductiveModeExplicit") fun setProductiveMode(/g' "$MAIN"
          sed -i 's/fun setStudyMode(/@kotlin.jvm.JvmName("setStudyModeExplicit") fun setStudyMode(/g' "$MAIN"
          sed -i 's/fun setChargingNotchEnabled(/@kotlin.jvm.JvmName("setChargingNotchEnabledExplicit") fun setChargingNotchEnabled(/g' "$MAIN"
          sed -i 's/fun setChargingNotchStyle(/@kotlin.jvm.JvmName("setChargingNotchStyleExplicit") fun setChargingNotchStyle(/g' "$MAIN"
          sed -i 's/fun setChargingNotchSpeed(/@kotlin.jvm.JvmName("setChargingNotchSpeedExplicit") fun setChargingNotchSpeed(/g' "$MAIN"
          echo "=== RUN 23 JVM SETTER PATCH ==="
          grep -nE 'JvmName|fun set(Icon|Animation|Edge|Settings|Drawer|CurrentHome|Performance|Productive|Study|Charging)' "$MAIN" || true
          # Run 22: @JvmField removes generated JVM accessors that clash with explicit setters.
          sed -i 's/var iconSize=IconSize.MEDIUM private set/@JvmField var iconSize=IconSize.MEDIUM/' "$MAIN"
          sed -i 's/var iconShape=IconShape.ROUNDED private set/@JvmField var iconShape=IconShape.ROUNDED/' "$MAIN"
          sed -i 's/var animationValue=0.8f private set/@JvmField var animationValue=0.8f/' "$MAIN"
          sed -i 's/var animationDuration=0.28f private set/@JvmField var animationDuration=0.28f/' "$MAIN"
          sed -i 's/var animationType=AnimationType.SPRING private set/@JvmField var animationType=AnimationType.SPRING/' "$MAIN"
          sed -i 's/var edgeGesture=EdgeGesture.LEFT private set/@JvmField var edgeGesture=EdgeGesture.LEFT/' "$MAIN"
          sed -i 's/var settingsPage="main" private set/@JvmField var settingsPage="main"/' "$MAIN"
          sed -i 's/var drawerListMode=true private set/@JvmField var drawerListMode=true/' "$MAIN"
          sed -i 's/var drawerCategory="All" private set/@JvmField var drawerCategory="All"/' "$MAIN"
          sed -i 's/var currentHomePage=0 private set/@JvmField var currentHomePage=0/' "$MAIN"
          sed -i 's/var performanceMode=PerformanceMode.BALANCED private set/@JvmField var performanceMode=PerformanceMode.BALANCED/' "$MAIN"
          sed -i 's/var productiveMode=false private set/@JvmField var productiveMode=false/' "$MAIN"
          sed -i 's/var studyMode=false private set/@JvmField var studyMode=false/' "$MAIN"
          sed -i 's/var chargingNotchEnabled=true private set/@JvmField var chargingNotchEnabled=true/' "$MAIN"
          sed -i 's/var chargingNotchStyle="Glow" private set/@JvmField var chargingNotchStyle="Glow"/' "$MAIN"
          sed -i 's/var chargingNotchSpeed=70f private set/@JvmField var chargingNotchSpeed=70f/' "$MAIN"
          echo "=== PATCHED IMPORTS ==="
          grep -nE 'composed|horizontalScroll|onNewIntent|ComponentName\(pkg' "$MAIN" || true
          echo "=== MAINACTIVITY DIAGNOSTIC ==="
          sed -n '1,240p' "$MAIN"
          sed -n '490,535p' "$MAIN"
          sed -n '690,790p' "$MAIN"
          sed -n '910,940p' "$MAIN"
          sed -n '1085,1110p' "$MAIN"
          sed -n '1185,1238p' "$MAIN"
          sed -n '1275,1330p' "$MAIN"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            curl -fsSL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o /tmp/gradle.zip
            rm -rf /tmp/gradle-9.5.0
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-9.5.0/bin/gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neumor-UI-2-debug-apk
          path: ${{ env.PROJECT_ROOT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
