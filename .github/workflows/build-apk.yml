name: Build APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p project
          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d project
          ROOT="project"
          if [ ! -f "$ROOT/settings.gradle" ] && [ ! -f "$ROOT/settings.gradle.kts" ]; then
            ROOT="$(dirname "$(find "$ROOT" -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          fi
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon --stacktrace assembleDebug; else gradle --no-daemon --stacktrace assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Neumor-UI-2-debug-apk
          path: ${{ env.PROJECT_ROOT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
